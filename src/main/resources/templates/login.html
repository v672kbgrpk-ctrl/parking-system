<!DOCTYPE html>
<html lang="zh-CN" class="page-fill" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${login_title}+'-登录'"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="keywords" content="智能停车场管理平台">
    <meta name="description" content="智能停车场管理平台">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" type="image/x-icon"/>
    <link rel="stylesheet" th:href="@{/lib/layui/css/layui.css}"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(135deg, #1a4d3d 0%, #0d3d2d 50%, #1a4d3d 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            animation: slideUp 0.5s ease-out;
            border: 1px solid rgba(46, 139, 87, 0.1);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(46, 139, 87, 0.3);
            margin-bottom: 16px;
        }
        
        .title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #2e8b57, #166534);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .desc {
            font-size: 14px;
            color: #4a7c62;
        }
        
        .layui-form-item {
            margin-bottom: 20px;
        }
        
        .layui-form-item .layui-input {
            height: 48px;
            border-radius: 14px;
            border: 2px solid #e5e7eb;
            padding: 0 16px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .layui-form-item .layui-input:focus {
            border-color: #2e8b57;
            box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
            background: #fff;
        }
        
        .code-section {
            display: flex;
            gap: 12px;
        }
        
        .code {
            flex: 1;
        }
        
        .codeImage {
            width: 120px;
            height: 48px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .codeImage:hover {
            border-color: #2e8b57;
            transform: scale(1.02);
        }
        
        .remember-section {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #4a7c62;
        }
        
        .layui-form-checkbox {
            margin-right: 8px;
        }
        
        .login-btn {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #2e8b57, #166534);
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 139, 87, 0.4);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 139, 87, 0.5);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .layui-form-checkbox[lay-skin=primary] i {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border-color: #d1d5db;
        }
        
        .layui-form-checkbox[lay-skin=primary] i:hover {
            border-color: #2e8b57;
        }
        
        .layui-form-checkbox[lay-skin=primary]:checked i {
            background: linear-gradient(135deg, #2e8b57, #166534);
            border-color: #2e8b57;
        }
        
        .layui-input::-webkit-input-placeholder {
            color: #9ca3af;
        }
        
        .layui-input::-moz-placeholder {
            color: #9ca3af;
        }
        
        .layui-input:-ms-input-placeholder {
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form class="layui-form" action="javascript:void(0);">
            <div class="logo-section">
                <img class="logo" th:src="@{images/logo.png}" />
                <div class="title">Smart-Parking</div>
                <div class="desc" th:text="${login_title}"></div>
            </div>
            
            <div class="layui-form-item">
                <input name="username" type="text" placeholder="账号" value="admin" class="layui-input" />
            </div>
            
            <div class="layui-form-item">
                <input name="password" type="password" placeholder="密码" value="admin" class="layui-input" />
            </div>
            
            <div class="layui-form-item code-section">
                <input placeholder="验证码" name="verCode" class="code layui-input" />
                <img th:src="@{/sys/captcha}" class="codeImage" id="captchaImage"/>
            </div>
            
            <div class="layui-form-item remember-section">
                <input type="checkbox" name="rememberMe" value="true" title="记住密码" lay-skin="primary">
                <span>记住密码</span>
            </div>
            
            <div class="layui-form-item">
                <button class="login-btn" lay-submit lay-filter="login">
                    登 入
                </button>
            </div>
        </form>
    </div>
    
    <script th:src="@{/lib/layui/layui.js}"></script>
    <script>
        layui.use(['form', "okUtils", "okLayer"], function() {
            var form = layui.form;
            var $ = layui.jquery;
            var okUtils = layui.okUtils;
            var okLayer = layui.okLayer;
            var captchaPath = "/sys/captcha";
            
            form.on('submit(login)', function(data){
                $.ajax({
                    url:'/sys/login',
                    data:data.field,
                    type:"post",
                    dataType:'json',
                    success:function(result){
                        if(result.code==0){
                            okLayer.msg.greenTick(result.msg, function () {
                                sessionStorage.setItem('username', $("input[name='username']").val());
                                window.location = "index.html";
                            });
                        }else if(result.code==400){
                            okLayer.msg.redCross(result.msg)
                            document.getElementById("captchaImage").src= captchaPath + "?" + Math.random();
                        }
                    }
                });
                return false;
            });
            
            $("#captchaImage").click(function(){
                document.getElementById("captchaImage").src= captchaPath + "?" + Math.random();
            });
            
            setInterval(function(){
                document.getElementById("captchaImage").src= captchaPath + "?" + Math.random();
            }, 30 * 1000);
        });
    </script>
    <script>
        window.onload=function(){
            if (window != top) {
                alert("您的账号在另一台设备上登录，若非本人操作，请立即修改密码")
                top.location.href = location.href;
            }
        }
    </script>
</body>
</html>
