<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>控制台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="keywords" content="控制台">
    <meta name="description" content="控制台">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <script type="text/javascript" th:src="@{/lib/echarts/echarts.min.js}"></script>
    <script type="text/javascript" th:src="@{/lib/echarts/echarts.theme.js}"></script>
    <link rel="stylesheet" th:href="@{/lib/layui/css/layui.css}" media="all"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #f0fdf4; 
            min-height: 100vh; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .ok-body.home {
            padding: 24px 32px;
            min-height: 100vh;
        }
        
        /* 统计卡片 - 玻璃质感 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
            width: 100%;
        }
        
        .stats-row .stat-item {
            width: 100%;
            padding: 0;
            margin: 0;
        }
        
        .charts-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
            width: 100%;
        }
        
        .charts-row .chart-item {
            width: 100%;
            padding: 0;
            margin: 0;
        }
        
        @media (max-width: 768px) {
            .ok-body.home {
                padding: 16px;
            }
            
            .stats-row,
            .charts-row {
                grid-template-columns: 1fr;
            }
        }
        
        /* 统计卡片样式 */
        .layui-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(46, 139, 87, 0.1);
            border-radius: 28px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        .layui-card:hover {
            transform: translateY(-8px);
            background: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .ok-card-body {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }
        
        .ok-card-body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2e8b57, #166534);
        }
        
        .img-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(46, 139, 87, 0.15), rgba(22, 101, 52, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .layui-card:hover .img-box {
            transform: scale(1.1);
        }
        
        .img-box img {
            width: 28px;
            height: 28px;
        }
        
        .cart-r {
            flex: 1;
            min-width: 0;
        }
        
        .stat-text {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #1a4d3d, #2d5a4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        
        .stat-heading {
            font-size: 13px;
            color: #4a7c62;
        }
        
        /* 图表卡片 */
        .chart-card {
            background: white;
            border-radius: 28px;
            padding: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border: 1px solid rgba(46, 139, 87, 0.08);
            transition: all 0.3s ease;
        }
        
        .chart-card:hover {
            box-shadow: 0 16px 40px rgba(0,0,0,0.1);
        }
        
        .layui-card-header {
            padding: 24px;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-bottom: 1px solid rgba(46, 139, 87, 0.1);
        }
        
        .ok-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a4d3d;
        }
        
        .chart-container {
            padding: 24px;
            height: 320px;
        }
        
        .chart-container.full-height {
            height: 400px;
        }
        
        /* 统计卡片颜色主题 - 墨绿色系 */
        .stat-card-primary .ok-card-body::before {
            background: linear-gradient(90deg, #2e8b57, #166534);
        }
        .stat-card-primary .img-box {
            background: linear-gradient(135deg, rgba(46, 139, 87, 0.15), rgba(22, 101, 52, 0.1));
        }
        
        .stat-card-success .ok-card-body::before {
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }
        .stat-card-success .img-box {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(34, 197, 94, 0.1));
        }
        
        .stat-card-warning .ok-card-body::before {
            background: linear-gradient(90deg, #a3e635, #84cc16);
        }
        .stat-card-warning .img-box {
            background: linear-gradient(135deg, rgba(163, 230, 53, 0.15), rgba(132, 204, 22, 0.1));
        }
        
        .stat-card-info .ok-card-body::before {
            background: linear-gradient(90deg, #14b8a6, #0d9488);
        }
        .stat-card-info .img-box {
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.15), rgba(13, 148, 136, 0.1));
        }
        
        .stat-card-danger .ok-card-body::before {
            background: linear-gradient(90deg, #f87171, #ef4444);
        }
        .stat-card-danger .img-box {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.15), rgba(239, 68, 68, 0.1));
        }
        
        .stat-card-dark .ok-card-body::before {
            background: linear-gradient(90deg, #3d5a4a, #1a4d3d);
        }
        .stat-card-dark .img-box {
            background: linear-gradient(135deg, rgba(61, 90, 74, 0.15), rgba(26, 77, 61, 0.1));
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #4a7c62;
        }
        
        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid rgba(46, 139, 87, 0.2);
            border-top-color: #2e8b57;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(46, 139, 87, 0.1);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #2e8b57, #166534);
            border-radius: 10px;
        }
    </style>
</head>
<body class="ok-body-scroll console">
    <div class="ok-body home">
        <!-- 统计卡片区域 - 8个卡片，每行2个，靠右对齐 -->
        <div class="stats-row">
            <div class="stat-item">
                <div class="layui-card stat-card-primary">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-01.png}" alt="今日入场"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="todayInCount">0</div>
                            <div class="stat-heading">今日入场车辆</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="stat-item">
                <div class="layui-card stat-card-success">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-02.png}" alt="今日出场"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="todayOutCount">0</div>
                            <div class="stat-heading">今日出场车辆</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stat-item">
                <div class="layui-card stat-card-warning">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-03.png}" alt="今日收入"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="todayIncome">¥0</div>
                            <div class="stat-heading">今日收入</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stat-item">
                <div class="layui-card stat-card-info">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-04.png}" alt="车位使用率"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="usageRate">0%</div>
                            <div class="stat-heading">车位使用率</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stat-item">
                <div class="layui-card stat-card-danger">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-01.png}" alt="当前在场"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="currentInCount">0</div>
                            <div class="stat-heading">当前在场车辆</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="stat-item">
                <div class="layui-card stat-card-dark">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-02.png}" alt="停车场数"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="parkCount">0</div>
                            <div class="stat-heading">停车场数量</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stat-item">
                <div class="layui-card stat-card-primary">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-03.png}" alt="总车位"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="totalSpaces">0</div>
                            <div class="stat-heading">总车位数</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="stat-item">
                <div class="layui-card stat-card-success">
                    <div class="ok-card-body">
                        <div class="img-box">
                            <img th:src="@{images/home-04.png}" alt="合作单位"/>
                        </div>
                        <div class="cart-r">
                            <div class="stat-text" id="orgNumber">0</div>
                            <div class="stat-heading">合作单位数量</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="chart-item">
                <div class="layui-card chart-card">
                    <div class="layui-card-header">
                        <div class="ok-card-title">最近7天收入趋势</div>
                    </div>
                    <div class="chart-container" id="incomeTrendChart">
                        <div class="loading">加载中</div>
                    </div>
                </div>
            </div>

            <div class="chart-item">
                <div class="layui-card chart-card">
                    <div class="layui-card-header">
                        <div class="ok-card-title">车辆类型分布</div>
                    </div>
                    <div class="chart-container" id="carTypeChart">
                        <div class="loading">加载中</div>
                    </div>
                </div>
            </div>
            
            <div class="chart-item">
                <div class="layui-card chart-card">
                    <div class="layui-card-header">
                        <div class="ok-card-title">今日各时段车流量</div>
                    </div>
                    <div class="chart-container" id="hourlyTrafficChart">
                        <div class="loading">加载中</div>
                    </div>
                </div>
            </div>

            <div class="chart-item">
                <div class="layui-card chart-card">
                    <div class="layui-card-header">
                        <div class="ok-card-title">支付方式分布</div>
                    </div>
                    <div class="chart-container" id="payTypeChart">
                        <div class="loading">加载中</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript" th:src="@{/lib/layui/layui.js}"></script>
    <script th:src="@{/lib/common/jquery.js}"></script>
    <script>
        // 加载今日统计数据
        function loadTodayStats() {
            $.get('/dashboard/todayStats', function(res) {
                if (res && res.code === 0 && res.data) {
                    var data = res.data;
                    $('#todayInCount').text(data.todayInCount || 0);
                    $('#todayOutCount').text(data.todayOutCount || 0);
                    $('#todayIncome').text('¥' + (data.todayIncome || 0));
                    $('#usageRate').text((data.usageRate || 0) + '%');
                    $('#currentInCount').text(data.currentInCount || 0);
                    $('#parkCount').text(data.parkCount || 0);
                    $('#totalSpaces').text(data.totalSpaces || 0);
                    $('#orgNumber').text(data.orgNumber || 0);
                }
            });
        }
        
        // 加载收入趋势图
        function loadIncomeTrend() {
            $.get('/dashboard/incomeTrend', function(res) {
                if (res && res.code === 0 && res.data) {
                    var dates = res.data.map(function(item) { return item.date; });
                    var incomes = res.data.map(function(item) { return item.income; });
                    
                    var chart = echarts.init(document.getElementById('incomeTrendChart'));
                    var option = {
                        tooltip: {
                            trigger: 'axis',
                            formatter: function(params) {
                                return params[0].name + '<br/>收入: ¥' + params[0].value;
                            }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'category',
                            data: dates,
                            axisLine: { lineStyle: { color: '#d1d5db' } },
                            axisLabel: { color: '#4a7c62' }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: { lineStyle: { color: '#d1d5db' } },
                            axisLabel: { color: '#4a7c62', formatter: '¥{value}' },
                            splitLine: { lineStyle: { color: '#ecfdf5' } }
                        },
                        series: [{
                            name: '收入',
                            type: 'line',
                            data: incomes,
                            smooth: true,
                            symbol: 'circle',
                            symbolSize: 8,
                            lineStyle: {
                                color: '#2e8b57',
                                width: 3
                            },
                            itemStyle: {
                                color: '#2e8b57',
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            areaStyle: {
                                color: {
                                    type: 'linear',
                                    x: 0, y: 0, x2: 0, y2: 1,
                                    colorStops: [
                                        { offset: 0, color: 'rgba(46, 139, 87, 0.3)' },
                                        { offset: 1, color: 'rgba(46, 139, 87, 0.05)' }
                                    ]
                                }
                            }
                        }]
                    };
                    chart.setOption(option);
                    
                    window.addEventListener('resize', function() {
                        chart.resize();
                    });
                }
            });
        }
        
        // 加载车辆类型分布图
        function loadCarTypeDistribution() {
            $.get('/dashboard/carTypeDistribution', function(res) {
                if (res && res.code === 0 && res.data) {
                    var chart = echarts.init(document.getElementById('carTypeChart'));
                    var option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: '{b}: {c} ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            left: 'left',
                            textStyle: { color: '#4a7c62' }
                        },
                        series: [{
                            type: 'pie',
                            radius: ['40%', '70%'],
                            center: ['60%', '50%'],
                            avoidLabelOverlap: false,
                            itemStyle: {
                                borderRadius: 10,
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            label: {
                                show: false,
                                position: 'center'
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: 18,
                                    fontWeight: 'bold',
                                    color: '#1a4d3d'
                                }
                            },
                            labelLine: { show: false },
                            data: res.data,
                            color: ['#2e8b57', '#4ade80', '#a3e635']
                        }]
                    };
                    chart.setOption(option);
                    
                    window.addEventListener('resize', function() {
                        chart.resize();
                    });
                }
            });
        }
        
        // 加载今日各时段车流量图
        function loadHourlyTraffic() {
            $.get('/dashboard/hourlyTraffic', function(res) {
                if (res && res.code === 0 && res.data) {
                    var hours = res.data.map(function(item) { return item.hour; });
                    var counts = res.data.map(function(item) { return item.count; });
                    
                    var chart = echarts.init(document.getElementById('hourlyTrafficChart'));
                    var option = {
                        tooltip: {
                            trigger: 'axis',
                            formatter: function(params) {
                                return params[0].name + '<br/>车流量: ' + params[0].value + ' 辆';
                            }
                        },
                        grid: {
                            left: '3%',
                            right: '4%',
                            bottom: '3%',
                            containLabel: true
                        },
                        xAxis: {
                            type: 'category',
                            data: hours,
                            axisLine: { lineStyle: { color: '#d1d5db' } },
                            axisLabel: { color: '#4a7c62', interval: 2 }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: { lineStyle: { color: '#d1d5db' } },
                            axisLabel: { color: '#4a7c62' },
                            splitLine: { lineStyle: { color: '#ecfdf5' } }
                        },
                        series: [{
                            name: '车流量',
                            type: 'bar',
                            data: counts,
                            itemStyle: {
                                color: {
                                    type: 'linear',
                                    x: 0, y: 0, x2: 0, y2: 1,
                                    colorStops: [
                                        { offset: 0, color: '#2e8b57' },
                                        { offset: 1, color: '#166534' }
                                    ]
                                },
                                borderRadius: [6, 6, 0, 0]
                            }
                        }]
                    };
                    chart.setOption(option);
                    
                    window.addEventListener('resize', function() {
                        chart.resize();
                    });
                }
            });
        }
        
        // 加载支付方式分布图
        function loadPayTypeDistribution() {
            $.get('/dashboard/payTypeDistribution', function(res) {
                if (res && res.code === 0 && res.data) {
                    var chart = echarts.init(document.getElementById('payTypeChart'));
                    var option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: '{b}: {c} ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            left: 'left',
                            textStyle: { color: '#4a7c62' }
                        },
                        series: [{
                            type: 'pie',
                            radius: ['40%', '70%'],
                            center: ['60%', '50%'],
                            avoidLabelOverlap: false,
                            itemStyle: {
                                borderRadius: 10,
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            label: {
                                show: false,
                                position: 'center'
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: 18,
                                    fontWeight: 'bold',
                                    color: '#1a4d3d'
                                }
                            },
                            labelLine: { show: false },
                            data: res.data,
                            color: ['#2e8b57', '#4ade80', '#a3e635', '#14b8a6']
                        }]
                    };
                    chart.setOption(option);
                    
                    window.addEventListener('resize', function() {
                        chart.resize();
                    });
                }
            });
        }
        
        // 页面加载完成后初始化
        $(document).ready(function() {
            loadTodayStats();
            loadIncomeTrend();
            loadCarTypeDistribution();
            loadHourlyTraffic();
            loadPayTypeDistribution();
            
            // 每30秒刷新一次统计数据
            setInterval(loadTodayStats, 30000);
        });
    </script>
</body>
</html>
